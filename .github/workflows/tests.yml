name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Python 3.9 is past its end of life and is not built for the newest
          # Ubuntu runner, so it is tested on the last Ubuntu that still has it.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install loop-autopsy with its test tools
        run: python -m pip install -e ".[test]"

      - name: Run the tests
        run: python -m pytest --cov=loop_autopsy --cov-report=term-missing

      - name: Check that the benchmark still runs
        run: python benchmarks/overhead.py --rounds 20000 --repeats 2
        env:
          PYTHONIOENCODING: utf-8

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
