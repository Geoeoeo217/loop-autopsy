[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-autopsy"
version = "0.1.0"
description = "Stops runaway loops in Jupyter and shows the evidence for why they never ended."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NATHANAEL George Steindhart" },
    { name = "SETIAWAN Matthew Henson" },
    { name = "LATHIF Muhammad Akmal" },
    { name = "KWAN Kendrick Matthew" },
    { name = "HANDAYA Clement Steward" },
]
keywords = ["jupyter", "ipython", "education", "infinite-loop", "debugging", "beginners"]
classifiers = [
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["ipython>=7.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Geoeoeo217/loop-autopsy"
Repository = "https://github.com/Geoeoeo217/loop-autopsy"
Documentation = "https://github.com/Geoeoeo217/loop-autopsy#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
