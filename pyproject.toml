[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-autopsy"
dynamic = ["version"]  # read from __version__ in src/loop_autopsy/__init__.py
description = "Stops runaway loops in Jupyter and shows the evidence for why they never ended."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NATHANAEL George Steindhart" },
    { name = "SETIAWAN Matthew Henson" },
    { name = "LATHIF Muhammad Akmal" },
    { name = "KWAN Kendrick Matthew" },
    { name = "HANDAYA Clement Steward" },
]
keywords = ["jupyter", "ipython", "education", "infinite-loop", "debugging", "beginners"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["ipython>=8.15"]  # tested in CI ("oldest" job); older ones fail tests

[project.optional-dependencies]
memory = ["psutil>=5.6"]  # exact memory readings on macOS and in containers; optional
test = ["pytest>=7", "pytest-cov>=4", "nbclient>=0.5", "ipykernel>=6", "numpy", "cloudpickle", "psutil"]  # numpy, cloudpickle: tests only; psutil: also tests [memory]
typecheck = ["mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/Geoeoeo217/loop-autopsy"
Repository = "https://github.com/Geoeoeo217/loop-autopsy"
Documentation = "https://github.com/Geoeoeo217/loop-autopsy#readme"

[tool.setuptools.dynamic]
version = { attr = "loop_autopsy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loop_autopsy = ["py.typed"]

[tool.mypy]
python_version = "3.10"  # the oldest mypy accepts; the code itself still runs on 3.9
platform = "linux"  # the same answer on every computer (os.sysconf, ctypes.WinDLL)
files = ["src/loop_autopsy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
