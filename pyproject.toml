[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-autopsy"
version = "0.3.0"
description = "Stops runaway loops in Jupyter and shows the evidence for why they never ended."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NATHANAEL George Steindhart" },
    { name = "SETIAWAN Matthew Henson" },
    { name = "LATHIF Muhammad Akmal" },
    { name = "KWAN Kendrick Matthew" },
    { name = "HANDAYA Clement Steward" },
]
keywords = ["jupyter", "ipython", "education", "infinite-loop", "debugging", "beginners"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["ipython>=7.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "nbclient", "ipykernel"]

[project.urls]
Homepage = "https://github.com/Geoeoeo217/loop-autopsy"
Repository = "https://github.com/Geoeoeo217/loop-autopsy"
Documentation = "https://github.com/Geoeoeo217/loop-autopsy#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
